[package]
name = "fast"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1"
rustc-hash = "2"
parquet = { version = "60", default-features = false, features = ["snap", "zstd"] }
memmap2 = "0.9"
memchr = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
