[package]
name = "fast"
version = "0.1.0"
edition = "2021"

[dependencies]
rustc-hash = "2"
memmap2 = "0.9"
memchr = "2"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = ["mimalloc"]
huge = []
hugealloc = []
mimalloc = ["dep:mimalloc"]
cov = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
