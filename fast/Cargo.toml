[package]
name = "fast"
version = "0.1.0"
edition = "2021"

[dependencies]
rustc-hash = "2"
parquet = { version = "60", default-features = false, features = ["snap", "zstd"], optional = true }
memmap2 = "0.9"
memchr = "2"
libc = "0.2"

[features]
huge = []
tools = ["dep:parquet"]
hugealloc = []

[[bin]]
name = "pq2csv"
required-features = ["tools"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
